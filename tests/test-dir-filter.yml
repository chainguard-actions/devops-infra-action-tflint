name: Test dir_filter - only lint matching directories
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run tflint action with dir_filter for modules
        id: action
        uses: .
        with:
          fail_on_changes: "true"
          dir_filter: "tests/fixtures/modules"
          tflint_config: "tests/fixtures/tflint-config/.tflint.hcl"
          run_init: "false"

      - name: Assert action succeeded with dir_filter
        run: |
          echo "Action completed successfully with dir_filter=tests/fixtures/modules"
          echo "PASS"
