name: Test tflint with dir_filter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          fail_on_changes: "true"
          dir_filter: "tests/fixtures/tf-included"
          tflint_config: "tests/fixtures/.tflint.hcl"
          run_init: "false"

      - name: Assert action completed with dir_filter applied
        run: |
          echo "Action completed with dir_filter=tests/fixtures/tf-included"
          echo "PASS"
