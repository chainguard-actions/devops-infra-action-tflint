name: Test fail_on_changes false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          fail_on_changes: "false"
          dir_filter: "pristine/devops-infra--action-tflint/v1.0.1/tests/fixtures/tf-nofail"
          tflint_config: "pristine/devops-infra--action-tflint/v1.0.1/tests/fixtures/.tflint.hcl"
          run_init: "false"

      - name: Assert action completed without failing
        run: |
          echo "PASS: tflint ran with fail_on_changes=false and did not fail"
