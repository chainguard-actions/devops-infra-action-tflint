name: Test tflint with fail_on_changes false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Terraform file
        run: |
          mkdir -p mymodule
          cat > mymodule/main.tf << 'EOF'
          resource "null_resource" "example" {}
          EOF

      - name: Create tflint config
        run: |
          cat > .tflint.hcl << 'EOF'
          config {
            disabled_by_default = false
          }
          EOF

      - id: action
        uses: .
        with:
          fail_on_changes: "false"
          run_init: "false"

      - name: Assert action completed without failing
        run: |
          echo "Action completed with fail_on_changes=false"
          echo "PASS"
