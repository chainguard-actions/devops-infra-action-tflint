name: Test tflint with fail_on_changes false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          fail_on_changes: "false"
          dir_filter: "tests/fixtures/tf-nofail"
          tflint_config: "tests/fixtures/.tflint.hcl"
          run_init: "false"

      - name: Assert action completed without failing
        run: |
          echo "Action completed with fail_on_changes=false"
          echo "PASS"
