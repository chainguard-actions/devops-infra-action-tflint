name: Test basic usage - valid Terraform files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run tflint action on valid Terraform
        id: action
        uses: .
        with:
          fail_on_changes: "true"
          dir_filter: "tests/fixtures/tf-basic"
          tflint_config: "tests/fixtures/tflint-config/.tflint.hcl"
          run_init: "false"

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully (no exit 1 from action step)"
          echo "PASS"
