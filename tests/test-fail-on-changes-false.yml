name: Test fail_on_changes=false - action should not fail even with lint issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run tflint action with fail_on_changes=false
        id: action
        uses: .
        with:
          fail_on_changes: "false"
          dir_filter: "tests/fixtures/tf-nofail"
          tflint_config: "tests/fixtures/tflint-config/.tflint.hcl"
          run_init: "false"

      - name: Assert action did not fail
        run: |
          echo "Action completed without failure (fail_on_changes=false)"
          echo "PASS"
